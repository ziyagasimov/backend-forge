version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
      - minio
    env_file:
      - .env
    environment:
      # Use internal Docker hostnames
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/backend_forge
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./app:/app/app

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_forge
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
